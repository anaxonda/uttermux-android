name: Android

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify native provenance
        run: ./native/verify-provenance.sh
      - name: Verify pinned catalog
        run: python3 scripts/sync-catalog.py --check
      - name: Unit tests and lint
        run: ./gradlew testIsolatedHostUnitTest lintDebug
      - name: Build APK
        run: ./gradlew assembleDebug
      - name: Audit APK payload
        run: ./scripts/audit-apk.sh app/build/outputs/apk/debug/app-debug.apk
