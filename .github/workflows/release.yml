name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v4
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Require signing configuration
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: test -n "$KEYSTORE" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
      - name: Restore release keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/uttermux-release.jks"
      - run: ./native/verify-provenance.sh
      - name: Test, lint, and build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/uttermux-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease
      - name: Verify and name artifact
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "uttermux-android-${GITHUB_REF_NAME#v}-arm64.apk"
          ./scripts/audit-apk.sh "uttermux-android-${GITHUB_REF_NAME#v}-arm64.apk"
          sha256sum "uttermux-android-${GITHUB_REF_NAME#v}-arm64.apk" > SHA256SUMS
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "uttermux-android-${GITHUB_REF_NAME#v}-arm64.apk" SHA256SUMS
          --repo "$GITHUB_REPOSITORY" --prerelease --generate-notes
